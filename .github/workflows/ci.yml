name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Omarchy is Arch: test against the same packages users install.
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: >
          pacman -Syu --noconfirm --needed
          git jq nodejs python
          python-pytest ruff qt6-declarative

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plugin contract and QML syntax
        run: scripts/check-plugin.sh

      - name: Lint and format
        run: |
          ruff check backend tests scripts
          ruff format --check backend tests scripts

      - name: Backend tests
        run: python -m pytest -q

      - name: Widget model tests
        run: node --test tests/
